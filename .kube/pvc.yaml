# vibes' database (and, to come, every sketch's git repo). local-path, as for
# kokuzo's other apps: OpenEBS is gone, though its storage classes remain.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vibes-data
  namespace: vibes
spec:
  storageClassName: local-path
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
