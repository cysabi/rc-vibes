# vibes' edge (edge.yaml) sends vibes.hall.ly here. The node port is what
# kokuzo's Cloudflare tunnel used (nixos-config,
# system/kokuzo/cloudflared.nix), kept for going back to it: point
# vibes.hall.ly at the tunnel again, proxied.
apiVersion: v1
kind: Service
metadata:
  name: vibes
  namespace: vibes
spec:
  type: NodePort
  selector:
    app: vibes
  ports:
  - port: 8787
    targetPort: 8787
    nodePort: 30787
