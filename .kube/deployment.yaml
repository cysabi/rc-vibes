apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibes
  namespace: vibes
spec:
  replicas: 1
  # One SQLite database on one volume: the old one stops before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vibes
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: vibes
    spec:
      # Its account makes and stops sketches' boxes (boxes.yaml).
      serviceAccountName: vibes
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: vibes
        image: kokuzo.tailc38f.ts.net/vibes:latest
        # Each image is tagged with its commit.
        imagePullPolicy: IfNotPresent
        # ARCLAMP_KEY, SESSION_SECRET, RC_CLIENT_ID, RC_CLIENT_SECRET and
        # VIBES_SIGNING_KEY (what stamps built scripts; made on kokuzo).
        envFrom:
        - secretRef:
            name: vibes-secrets
        env:
        # vibes.recurse.com is RC's proxy in front of vibes.hall.ly.
        - name: PUBLIC_URL
          value: https://vibes.hall.ly,https://vibes.recurse.com
        - name: ARCLAMP_BASE_URL
          value: https://arclight.taild8299e.ts.net:8443
        - name: DATABASE_PATH
          value: /data/vibes.db
        - name: PORT
          value: "8787"
        # Sketches: their repos in /data/sketches, and each person's box a Kata
        # pod in vibes-boxes (boxes.yaml), with the homes on tank. BOX_IMAGE is
        # version.yaml's.
        - name: SKETCHES
          value: "1"
        - name: BOX_RUNNER
          value: kubernetes
        - name: BOX_NAMESPACE
          value: vibes-boxes
        - name: BOX_VIBES_URL
          value: http://vibes.vibes.svc.cluster.local:8787
        - name: BOX_HOMES
          value: /var/lib/vibes/box-homes
        ports:
        - containerPort: 8787
        readinessProbe:
          httpGet:
            path: /auth/options
            port: 8787
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /auth/options
            port: 8787
          periodSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vibes-data
