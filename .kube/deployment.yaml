apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibes
  namespace: vibes
spec:
  replicas: 1
  # One SQLite database on one volume: the old one stops before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vibes
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: vibes
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: vibes
        image: kokuzo.tailc38f.ts.net/vibes:latest
        # Each image is tagged with its commit.
        imagePullPolicy: IfNotPresent
        # ARCLAMP_KEY, SESSION_SECRET, RC_CLIENT_ID and RC_CLIENT_SECRET.
        envFrom:
        - secretRef:
            name: vibes-secrets
        env:
        # vibes.recurse.com is RC's proxy in front of vibes.hall.ly.
        - name: PUBLIC_URL
          value: https://vibes.hall.ly,https://vibes.recurse.com
        - name: ARCLAMP_BASE_URL
          value: https://arclight.taild8299e.ts.net:8443
        - name: DATABASE_PATH
          value: /data/vibes.db
        - name: PORT
          value: "8787"
        ports:
        - containerPort: 8787
        readinessProbe:
          httpGet:
            path: /auth/options
            port: 8787
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /auth/options
            port: 8787
          periodSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vibes-data
