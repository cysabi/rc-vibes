# vibes' edge: TLS for vibes.hall.ly, straight from the internet, in place of
# Cloudflare's tunnel (whose free plan sent each request through a data
# centre an ocean away). kokuzo's router forwards TCP 443 to kokuzo's 9443:
# this pod's hostPort, and nothing else's, so vibes is all that's reachable
# that way (kokuzo's own nginx, on 443, and Traefik, on 8443, aren't).
# Caddy proxies to vibes' service, WebSockets and the params stream as they
# are. Its certificate is Let's Encrypt's, by TLS-ALPN (the challenge comes
# in on 443, as everything does; there's no port 80, and no DNS credentials
# here), kept on a small volume so a restart doesn't ask again. HTTP/3 is
# off: only TCP is forwarded.
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge
  namespace: vibes
data:
  Caddyfile: |
    {
      https_port 9443
      http_port 9080
      auto_https disable_redirects
      admin off
      servers {
        protocols h1 h2
      }
    }

    vibes.hall.ly {
      tls {
        issuer acme {
          disable_http_challenge
        }
      }
      reverse_proxy vibes.vibes.svc.cluster.local:8787
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edge-data
  namespace: vibes
spec:
  storageClassName: local-path
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: vibes
spec:
  replicas: 1
  # One at a time: two can't both hold the hostPort.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vibes-edge
  template:
    metadata:
      labels:
        app: vibes-edge
      annotations:
        # Bumped with the Caddyfile, so a change to it restarts the pod.
        vibes/edge-config: "2"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: caddy
        image: caddy:2.11.7-alpine
        command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
        ports:
        - containerPort: 9443
          hostPort: 9443
          protocol: TCP
        volumeMounts:
        - { name: config, mountPath: /etc/caddy }
        - { name: data, mountPath: /data }
        - { name: state, mountPath: /config }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          # The image's caddy carries cap_net_bind_service as a file
          # capability: without it in the bounding set, it won't exec.
          capabilities:
            drop: [ALL]
            add: [NET_BIND_SERVICE]
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 256Mi
      volumes:
      - name: config
        configMap:
          name: edge
      - name: data
        persistentVolumeClaim:
          claimName: edge-data
      - name: state
        emptyDir: {}
---
# Where the edge may connect: DNS, vibes, and HTTPS on the public internet
# (Let's Encrypt), listed as in network.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge
  namespace: vibes
spec:
  podSelector:
    matchLabels:
      app: vibes-edge
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - { port: 53, protocol: UDP }
    - { port: 53, protocol: TCP }
  - to:
    - podSelector:
        matchLabels:
          app: vibes
    ports:
    - { port: 8787, protocol: TCP }
  - to:
    - ipBlock: { cidr: 1.0.0.0/8 }
    - ipBlock: { cidr: 2.0.0.0/7 }
    - ipBlock: { cidr: 4.0.0.0/6 }
    - ipBlock: { cidr: 8.0.0.0/7 }
    - ipBlock: { cidr: 11.0.0.0/8 }
    - ipBlock: { cidr: 12.0.0.0/6 }
    - ipBlock: { cidr: 16.0.0.0/4 }
    - ipBlock: { cidr: 32.0.0.0/3 }
    - ipBlock: { cidr: 64.0.0.0/3 }
    - ipBlock: { cidr: 96.0.0.0/6 }
    - ipBlock: { cidr: 100.0.0.0/10 }
    - ipBlock: { cidr: 100.128.0.0/9 }
    - ipBlock: { cidr: 101.0.0.0/8 }
