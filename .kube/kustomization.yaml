# vibes on kokuzo. Argo CD syncs this from the cd branch, which the deploy
# workflow pushes with version.yaml pointing at the commit's image.
resources:
- pvc.yaml
- deployment.yaml
- service.yaml
- boxes.yaml
- network.yaml

patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: vibes
  path: version.yaml
