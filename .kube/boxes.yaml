# Sketches' boxes (src/server/box-kube.ts): each person's VS Code for a
# sketch, as a Kata pod in its own namespace, with everyone's homes from a
# directory on kokuzo (BOX_HOMES), which only the box's agent sees, and only
# until it's moved one in (and vibes itself, read-only: deployment.yaml). vibes makes and removes them as its own service
# account, allowed to manage pods there and nothing else.
apiVersion: v1
kind: Namespace
metadata:
  name: vibes-boxes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vibes
  namespace: vibes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vibes-boxes
  namespace: vibes-boxes
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vibes-boxes
  namespace: vibes-boxes
subjects:
- kind: ServiceAccount
  name: vibes
  namespace: vibes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vibes-boxes
---
# What runs in a box is untrusted: it's reached only by vibes, and reaches
# only DNS, vibes (git, and the lights' layout) and the public internet; never
# the LAN, the tailnet (100.64.0.0/10), the cluster or kokuzo itself. k3s's
# policies ignore ipBlock's except, so the public internet is listed instead:
# all of IPv4 but 0/8, 10/8, 100.64/10, 127/8, 169.254/16, 172.16/12,
# 192.168/16 and 224/3.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: boxes
  namespace: vibes-boxes
spec:
  # Boxes, and builds (src/server/builds.ts): the same untrusted code.
  podSelector:
    matchExpressions:
    - { key: app, operator: In, values: [vibes-box, vibes-build] }
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vibes
      podSelector:
        matchLabels:
          app: vibes
    ports:
    - port: 3000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - { port: 53, protocol: UDP }
    - { port: 53, protocol: TCP }
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vibes
      podSelector:
        matchLabels:
          app: vibes
    ports:
    - port: 8787
  - to:
    - ipBlock: { cidr: 1.0.0.0/8 }
    - ipBlock: { cidr: 2.0.0.0/7 }
    - ipBlock: { cidr: 4.0.0.0/6 }
    - ipBlock: { cidr: 8.0.0.0/7 }
    - ipBlock: { cidr: 11.0.0.0/8 }
    - ipBlock: { cidr: 12.0.0.0/6 }
    - ipBlock: { cidr: 16.0.0.0/4 }
    - ipBlock: { cidr: 32.0.0.0/3 }
    - ipBlock: { cidr: 64.0.0.0/3 }
    - ipBlock: { cidr: 96.0.0.0/6 }
    - ipBlock: { cidr: 100.0.0.0/10 }
    - ipBlock: { cidr: 100.128.0.0/9 }
    - ipBlock: { cidr: 101.0.0.0/8 }
    - ipBlock: { cidr: 102.0.0.0/7 }
    - ipBlock: { cidr: 104.0.0.0/5 }
    - ipBlock: { cidr: 112.0.0.0/5 }
    - ipBlock: { cidr: 120.0.0.0/6 }
    - ipBlock: { cidr: 124.0.0.0/7 }
    - ipBlock: { cidr: 126.0.0.0/8 }
    - ipBlock: { cidr: 128.0.0.0/3 }
    - ipBlock: { cidr: 160.0.0.0/5 }
    - ipBlock: { cidr: 168.0.0.0/8 }
    - ipBlock: { cidr: 169.0.0.0/9 }
    - ipBlock: { cidr: 169.128.0.0/10 }
    - ipBlock: { cidr: 169.192.0.0/11 }
    - ipBlock: { cidr: 169.224.0.0/12 }
    - ipBlock: { cidr: 169.240.0.0/13 }
    - ipBlock: { cidr: 169.248.0.0/14 }
    - ipBlock: { cidr: 169.252.0.0/15 }
    - ipBlock: { cidr: 169.255.0.0/16 }
    - ipBlock: { cidr: 170.0.0.0/7 }
    - ipBlock: { cidr: 172.0.0.0/12 }
    - ipBlock: { cidr: 172.32.0.0/11 }
    - ipBlock: { cidr: 172.64.0.0/10 }
    - ipBlock: { cidr: 172.128.0.0/9 }
    - ipBlock: { cidr: 173.0.0.0/8 }
    - ipBlock: { cidr: 174.0.0.0/7 }
    - ipBlock: { cidr: 176.0.0.0/4 }
    - ipBlock: { cidr: 192.0.0.0/9 }
    - ipBlock: { cidr: 192.128.0.0/11 }
    - ipBlock: { cidr: 192.160.0.0/13 }
    - ipBlock: { cidr: 192.169.0.0/16 }
    - ipBlock: { cidr: 192.170.0.0/15 }
    - ipBlock: { cidr: 192.172.0.0/14 }
    - ipBlock: { cidr: 192.176.0.0/12 }
    - ipBlock: { cidr: 192.192.0.0/10 }
    - ipBlock: { cidr: 193.0.0.0/8 }
    - ipBlock: { cidr: 194.0.0.0/7 }
    - ipBlock: { cidr: 196.0.0.0/6 }
    - ipBlock: { cidr: 200.0.0.0/5 }
    - ipBlock: { cidr: 208.0.0.0/4 }
---
# What vibes may make here: exactly a box or a build as box-kube.ts makes
# them, nothing else, whoever asks. vibes' account can make any pod in this
# namespace, so without this a vibes taken over could make one that runs on
# kokuzo itself (privileged, the host's disks mounted). The Kata VM is what
# makes a box's root and capabilities safe; so every pod here runs in one,
# from the box image, with no host namespaces, no account token, none of the
# namespace's secrets, no host ports, and the homes folder the only thing
# from kokuzo it sees (a box's; a build has nothing).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vibes-boxes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
  variables:
  - name: app
    expression: "object.metadata.?labels.?app.orValue('')"
  # BOX_CAPABILITIES (boxes.ts) and BUILD_CAPABILITIES (builds.ts).
  - name: caps
    expression: >-
      variables.app == 'vibes-box'
        ? ['SYS_ADMIN', 'SETPCAP', 'CHOWN', 'SETUID', 'SETGID', 'KILL', 'FOWNER', 'DAC_OVERRIDE']
        : ['CHOWN', 'SETUID', 'SETGID', 'KILL', 'FOWNER', 'DAC_OVERRIDE']
  validations:
  - expression: "variables.app in ['vibes-box', 'vibes-build']"
    message: "a pod here is a box or a build (app: vibes-box or vibes-build), which the network policy covers"
  - expression: "object.spec.?runtimeClassName.orValue('') == 'kata'"
    message: "a box or a build runs in a Kata VM (runtimeClassName: kata)"
  - expression: "!object.spec.?hostNetwork.orValue(false) && !object.spec.?hostPID.orValue(false) && !object.spec.?hostIPC.orValue(false)"
    message: "no host namespaces"
  - expression: "object.spec.?automountServiceAccountToken.orValue(true) == false && object.spec.?serviceAccountName.orValue('default') == 'default'"
    message: "no service account token"
  - expression: "!has(object.spec.initContainers) && !has(object.spec.ephemeralContainers) && size(object.spec.containers) == 1"
    message: "one container"
  - expression: "object.spec.containers.all(c, c.image.startsWith('kokuzo.tailc38f.ts.net/vibes-box:'))"
    message: "the box image only"
  - expression: >-
      object.spec.containers.all(c,
        !c.?securityContext.?privileged.orValue(false) &&
        c.?securityContext.?procMount.orValue('Default') == 'Default' &&
        c.?securityContext.?capabilities.?drop.orValue([]) == ['ALL'] &&
        c.?securityContext.?capabilities.?add.orValue([]).all(a, a in variables.caps))
    message: "not privileged; all capabilities dropped but a box's or a build's own"
  - expression: "object.spec.containers.all(c, c.?ports.orValue([]).all(p, p.?hostPort.orValue(0) == 0 && p.?hostIP.orValue('') == ''))"
    message: "no host ports"
  - expression: "object.spec.containers.all(c, !has(c.envFrom) && c.?env.orValue([]).all(e, !has(e.valueFrom)) && !has(c.volumeDevices))"
    message: "plain env only: nothing from the namespace's secrets or config maps"
  - expression: "!has(object.spec.resourceClaims) && object.spec.containers.all(c, !has(c.resources) || !has(c.resources.claims))"
    message: "no devices"
  - expression: "!has(object.spec.securityContext) || (!has(object.spec.securityContext.sysctls) && !has(object.spec.securityContext.seLinuxOptions))"
    message: "no sysctls or SELinux options"
  - expression: >-
      variables.app == 'vibes-box'
        ? object.spec.?volumes.orValue([]).all(v, has(v.hostPath) && v.hostPath.path == '/var/lib/vibes/box-homes') &&
          object.spec.containers.all(c, c.?volumeMounts.orValue([]).all(m,
            m.name == 'homes' && m.mountPath == '/homes' && m.?mountPropagation.orValue('None') == 'None' && !has(m.subPathExpr)))
        : !has(object.spec.volumes) && object.spec.containers.all(c, !has(c.volumeMounts))
    message: "from kokuzo, a box sees only the homes folder (/var/lib/vibes/box-homes, at /homes); a build, nothing"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: vibes-boxes
spec:
  policyName: vibes-boxes
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: vibes-boxes
