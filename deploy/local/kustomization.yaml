# The same, on a local cluster (OrbStack's Kubernetes): locally built images,
# its own public URL, and boxes without Kata (there's none).
#   nix build .#boxImageLocal && docker load < result   (and tag it vibes-box:dev)
#   kubectl create namespace vibes
#   kubectl -n vibes create secret generic vibes-secrets --from-literal=...
#   kubectl apply -k deploy/local
resources:
- ../../.kube

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: vibes
      namespace: vibes
    spec:
      template:
        spec:
          containers:
          - name: vibes
            image: kokuzo.tailc38f.ts.net/vibes:dev
            env:
            - name: PUBLIC_URL
              value: http://localhost:30787
            - name: BOX_IMAGE
              value: vibes-box:dev
            - name: BOX_RUNTIME_CLASS
              value: ""
